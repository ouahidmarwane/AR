name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      # Base dédiée aux tests d'isolation (vidée et migrée par tests/global-setup.ts).
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ar_menu_test
          MYSQL_USER: ar_user
          MYSQL_PASSWORD: ar_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      # Valeurs factices, sans aucun secret réel.
      DATABASE_URL: mysql://ar_user:ar_password@127.0.0.1:3306/ar_menu
      TEST_DATABASE_URL: mysql://ar_user:ar_password@127.0.0.1:3306/ar_menu_test
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      # Version de pnpm lue dans le champ "packageManager" de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Même version que la production Hostinger (Node 24 LTS, voir .nvmrc).
          node-version-file: .nvmrc
          cache: pnpm

      - name: Versions
        run: node --version && pnpm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Build de production Hostinger (webpack, parallélisme limité) : détecte tôt une régression.
      - name: Build Hostinger (webpack)
        run: pnpm build:hostinger
